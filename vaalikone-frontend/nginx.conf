# Access log with party, registration and candidate tokens masked (issue #36).
# They're bearer secrets that never expire, and the default log records every
# request URI at every status: the API calls proxied below
# (/api/candidates/me/<token>, …) and the magic-link page loads
# (/?candidateToken=<token>). The result, $log_uri, is the only URI the log
# records. Same patterns as src/redactTokens.js;
# tests/unit/nginxLogRedaction.test.js checks them.
#
# The token segment of an API path. Lazy, so it's the first such segment: the
# one Express routes on.
map $request_uri $log_uri_path {
    "~*^(?<tok_pre>[^?]*?/candidates/(?:me|party|register)/)[^/?]+(?<tok_post>.*)$" "$tok_pre[token]$tok_post";
    default $request_uri;
}
# A query string carrying a magic-link param is dropped whole: a map replaces
# one match only, so masking the param itself would miss repeats of it (and
# URLSearchParams reads the first of them, which a greedy match skips).
map $log_uri_path $log_uri {
    "~^(?<tok_pre>[^?]*)\?(?:.*&)?(?:candidateToken|register|partyToken)=" "$tok_pre?[redacted]";
    default $log_uri_path;
}

# The image's default "main" format, with $log_uri for the URI. No Referer:
# the only one that could carry a token is this app's own pages, which send
# none (Referrer-Policy below), so it's dropped rather than masked. The
# upstream fields stand in for the error log, which is turned down below:
# status 502 vs 504, and connect vs response time, tell a dead replica from a
# hung one.
log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $log_uri $server_protocol" $status $body_bytes_sent '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time upstream=$upstream_addr upstream_status=$upstream_status '
                    'uct=$upstream_connect_time urt=$upstream_response_time';

server {
    # 8080: the container runs as the unprivileged nginx user (see Dockerfile),
    # which can't bind ports below 1024.
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log redacted;
    # nginx's error lines carry the raw request line and upstream URL, tokens
    # included, and their format can't be changed: a backend restart (deploy,
    # crash) would log a 502 "connect() failed … request: GET
    # /api/candidates/me/<token>" for every request in flight. The access log
    # above records those with the token masked and the upstream status.
    # Not airtight: resource exhaustion (worker_connections, file descriptors)
    # is logged at alert/crit with the request line too. Those are rare and
    # are what an operator most needs to see, so they're kept.
    error_log /var/log/nginx/error.log crit;

    # Gzip compression. gzip_proxied defaults to "off", which skips compression
    # for any request carrying a Via header — i.e. everything that arrives
    # through Caddy/Cloudflare in production. "any" compresses regardless.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy API requests to backend
    location /api/ {
        # The backend service runs with multiple replicas. A literal hostname in
        # proxy_pass is resolved once at startup and the IPs are pinned, so
        # replica restarts would 502. Resolving via Docker's embedded DNS with a
        # variable forces re-resolution (every 10s) and round-robins across all
        # current replicas. With a variable and no URI part, the original
        # /api/... URI is forwarded unchanged.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass through the proto set by the TLS-terminating proxy (Caddy/Cloudflare).
        # $scheme here is always "http" (TLS terminates upstream), so using it would
        # make the backend's HTTPS redirect loop on every HTTPS request. When nginx
        # is the edge (dev), the variable is empty and the header is simply omitted.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Party, registration and candidate tokens arrive as magic links
    # (?partyToken= / ?register= / ?candidateToken=); never leak them via Referer.
    add_header Referrer-Policy "no-referrer" always;
    # 'unsafe-inline' styles: the app styles everything inline. img-src https::
    # candidate photo_url is an arbitrary user-supplied URL. connect-src
    # sentry.io: browser error reporting (see src/main.jsx).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://*.sentry.io; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
}
