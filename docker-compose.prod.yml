services:
  # Don't publish the database port in production. Docker-published ports bind
  # 0.0.0.0 and bypass the host firewall; other services reach the db over the
  # internal compose network without it being exposed to the internet.
  db:
    ports: !reset []

  # Same rationale as db: in production all API traffic comes through
  # Caddy → frontend nginx, so the backend must not be reachable directly
  # (plaintext, bypassing TLS and Cloudflare) on a published host port.
  backend:
    ports: !reset []
    # One Node process per vCPU (the match computation is CPU-bound JS).
    # nginx re-resolves the backend service name via Docker DNS and
    # round-robins across replicas (see vaalikone-frontend/nginx.conf).
    # DB connections: replicas × PG_POOL_MAX (3 × 10 = 30) — keep well under
    # Postgres max_connections (100).
    deploy:
      replicas: 3
    environment:
      # Proxy hops in front of the app: Cloudflare → Caddy → frontend nginx.
      # Must match the real chain or rate limiting keys on a proxy IP instead
      # of the client. Set TRUST_PROXY_HOPS=2 if you run without Cloudflare.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-3}
      # Public hostname used for the HTTP→HTTPS redirect.
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      # docker-compose.yml defaults these to the dev-only mailpit, which
      # production never starts: a deploy without real SMTP settings sent
      # every email nowhere, or into a leftover mailpit container (#190).
      # The sender must be on a domain whose SPF/DKIM cover the SMTP provider.
      # The base port default is mailpit's 1025; providers listen on 587
      # (STARTTLS) or 465 (implicit TLS, whatever SMTP_SECURE says).
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set in production (the mailpit default is dev-only)}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM must be set in production, on a domain with SPF and DKIM for the SMTP provider}

  frontend:
    ports: !reset []

  # Dev-only mail catcher (profile "dev"), never started here. Should it run
  # anyway, keep it off the host's public interface: it holds every captured
  # message, magic links included (#190). scripts/deploy.sh removes it.
  mailpit:
    ports: !reset []

  # Nightly pg_dump → UpCloud Object Storage (S3-compatible) via rclone.
  # Production-only: election data lives in a single Docker volume otherwise.
  # If the BACKUP_S3_* vars are unset the sidecar still runs and keeps a
  # local dump in backup_data, but logs a warning instead of uploading.
  backup:
    build:
      context: ./scripts/backup
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://vaalikone:vaalikone_password@db:5432/vaalikone
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      RCLONE_CONFIG_UPCLOUD_TYPE: s3
      RCLONE_CONFIG_UPCLOUD_PROVIDER: Other
      RCLONE_CONFIG_UPCLOUD_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_UPCLOUD_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      RCLONE_CONFIG_UPCLOUD_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
      # The bucket is created by hand and the key is limited to listing it and
      # using its objects; without this rclone calls CreateBucket first and
      # gets 403 (#194).
      RCLONE_CONFIG_UPCLOUD_NO_CHECK_BUCKET: "true"
    volumes:
      - backup_data:/backups
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    # Minor version pinned: scripts/deploy.sh pulls on every deploy (#216),
    # so patch releases arrive by themselves, but a new minor only by editing
    # this. The token redaction in the Caddyfile (#36) depends on how Caddy
    # lays out its logs, which `caddy validate` can't check: after a bump,
    # look for tokens in `docker logs vaalikone-caddy`.
    image: caddy:2.11-alpine
    container_name: vaalikone-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  backup_data:
    driver: local
