services:
  # Don't publish the database port in production. Docker-published ports bind
  # 0.0.0.0 and bypass the host firewall; other services reach the db over the
  # internal compose network without it being exposed to the internet.
  db:
    ports: !reset []

  # Same rationale as db: in production all API traffic comes through
  # Caddy → frontend nginx, so the backend must not be reachable directly
  # (plaintext, bypassing TLS and Cloudflare) on a published host port.
  backend:
    ports: !reset []
    # One Node process per vCPU (the match computation is CPU-bound JS).
    # nginx re-resolves the backend service name via Docker DNS and
    # round-robins across replicas (see vaalikone-frontend/nginx.conf).
    # DB connections: replicas × PG_POOL_MAX (3 × 10 = 30) — keep well under
    # Postgres max_connections (100).
    deploy:
      replicas: 3
    environment:
      # Proxy hops in front of the app: Cloudflare → Caddy → frontend nginx.
      # Must match the real chain or rate limiting keys on a proxy IP instead
      # of the client. Set TRUST_PROXY_HOPS=2 if you run without Cloudflare.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-3}
      # Public hostname used for the HTTP→HTTPS redirect.
      PUBLIC_HOST: ${PUBLIC_HOST:-}

  frontend:
    ports: !reset []

  # Nightly pg_dump → UpCloud Object Storage (S3-compatible) via rclone.
  # Production-only: election data lives in a single Docker volume otherwise.
  # If the BACKUP_S3_* vars are unset the sidecar still runs and keeps a
  # local dump in backup_data, but logs a warning instead of uploading.
  backup:
    build:
      context: ./scripts/backup
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://vaalikone:vaalikone_password@db:5432/vaalikone
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      RCLONE_CONFIG_UPCLOUD_TYPE: s3
      RCLONE_CONFIG_UPCLOUD_PROVIDER: Other
      RCLONE_CONFIG_UPCLOUD_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_UPCLOUD_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      RCLONE_CONFIG_UPCLOUD_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
    volumes:
      - backup_data:/backups
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:alpine
    container_name: vaalikone-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  backup_data:
    driver: local
