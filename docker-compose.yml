# Bounded log files on every service — unbounded json-file logs can fill the
# disk under sustained traffic (e.g. election night).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: vaalikone-db
    restart: unless-stopped
    # Modest tuning for the read-mostly hot dataset; log_min_duration_statement
    # surfaces slow queries in the container logs. log_parameter_max_length=0
    # keeps their bind parameters out: the token lookups bind party,
    # registration and candidate tokens, which are bearer secrets (issue #36).
    command:
      [
        "postgres",
        "-c", "shared_buffers=256MB",
        "-c", "effective_cache_size=768MB",
        "-c", "log_min_duration_statement=250",
        "-c", "log_parameter_max_length=0",
      ]
    environment:
      POSTGRES_USER: vaalikone
      POSTGRES_PASSWORD: vaalikone_password
      POSTGRES_DB: vaalikone
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaalikone"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # Shared rate-limit store. No published ports (internal network only) and no
  # persistence (--save "") — rate-limit state is disposable. noeviction
  # because silently evicting rate-limit keys under memory pressure would
  # disable limiting.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  # Backend API. No container_name: production runs this service with multiple
  # replicas (docker-compose.prod.yml), which fixed names don't allow.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://vaalikone:vaalikone_password@db:5432/vaalikone
      REDIS_URL: redis://redis:6379
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      PG_STATEMENT_TIMEOUT_MS: ${PG_STATEMENT_TIMEOUT_MS:-}
      PG_QUERY_TIMEOUT_MS: ${PG_QUERY_TIMEOUT_MS:-}
      RATE_LIMIT_MATCH_MAX: ${RATE_LIMIT_MATCH_MAX:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:80}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET must be set (no insecure default)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-noreply@vaalikone.fi}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging

  # Local SMTP capture (dev only) — web UI at http://localhost:8025.
  # Gated behind the "dev" profile so it never starts in production; the prod
  # deploy doesn't request the profile, so this container is simply absent there.
  mailpit:
    image: axllent/mailpit
    container_name: vaalikone-mailpit
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "8025:8025"
      - "1025:1025"
    logging: *default-logging

  # Frontend
  frontend:
    build:
      context: ./vaalikone-frontend
      dockerfile: Dockerfile
      args:
        VITE_NODE_ENV: ${VITE_NODE_ENV:-production}
        VITE_API_BASE: ${VITE_API_BASE:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    container_name: vaalikone-frontend
    restart: unless-stopped
    ports:
      # Container listens on 8080 (unprivileged nginx); host still serves :80.
      - "80:8080"
    depends_on:
      - backend
    logging: *default-logging

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: vaalikone-network
