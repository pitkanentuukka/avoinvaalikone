name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vaalikone-frontend/package-lock.json

      - name: Install backend deps
        run: npm ci

      - name: Install frontend deps
        run: npm ci
        working-directory: vaalikone-frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: vaalikone-frontend

      - name: Unit + route tests
        run: npm test

  e2e-api:
    name: E2E API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaalikone
          POSTGRES_PASSWORD: vaalikone_password
          POSTGRES_DB: vaalikone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaalikone"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://vaalikone:vaalikone_password@localhost:5432/vaalikone
      ADMIN_SECRET: test-secret
      NODE_ENV: test
      PORT: 3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: PostgreSQL concurrency regression tests
        run: npm test -- --runInBand questionMergeConcurrency orphanQuestionConcurrency candidateRegistrationConcurrency
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Rate-limit store scripts on a real Redis
        run: npm test -- rateLimitStoreRedis
        env:
          REDIS_TEST_URL: redis://localhost:6379
          REQUIRE_REDIS_TEST: "1"

      - name: Run migrations
        run: npm run migrate

      - name: Start backend
        run: |
          npm start &
          for i in {1..30}; do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 1
          done
          echo "Backend failed to start"
          exit 1

      - name: Run E2E API tests
        run: npm run test:e2e:api

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to UpCloud
    needs: [lint-and-unit, e2e-api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Later deploys queue behind this job, so it must never wait out GitHub's
    # 6-hour limit (#178). A deploy takes about a minute; 30 leaves room for a
    # build with a cold cache. Not always for one that first waits (up to 10
    # minutes) for a lost deploy to finish (#205); hitting the limit then
    # only fails the job, as the deploy carries on detached on the server.
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # The ssh options (also used by rsync) give up on a server that stops
      # answering, rather than leaving the job to its timeout (#178).
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 80.69.172.220 >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'SSH_CONFIG'
          Host 80.69.172.220
            ConnectTimeout 10
            ServerAliveInterval 15
            ServerAliveCountMax 4
          SSH_CONFIG

      # Waits for a deploy still running on the server (one this job's
      # predecessor lost contact with, say) by taking deploy.sh's lock on the
      # tree (#205). The server-side rsync is time-limited: one whose client
      # is gone holds the lock until it ends, and only sshd would notice,
      # after about 15 minutes. The lock wait outlasts that limit. A wait
      # says so on stderr (not flock --verbose: it writes to stdout, which is
      # rsync's protocol stream), and one that runs out leaves only rsync's
      # "connection unexpectedly closed", hence the hint. mkdir: flock would
      # create a missing tree as a file. docs/scaling.md's manual deploy
      # repeats this command (tests/unit/manualDeployDoc.test.js).
      - name: Rsync to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --rsync-path="mkdir -p /opt/vaalikone && { flock -n /opt/vaalikone true || echo 'Waiting for another deploy to finish' >&2; } && flock -w 600 /opt/vaalikone timeout 300 rsync" \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='test-results' \
            --exclude='laptop*' \
            --exclude='upcloud*' \
            --exclude='.claude' \
            ./ root@80.69.172.220:/opt/vaalikone/ ||
            { echo "::error::rsync failed. If it was waiting for another deploy, that one still holds the lock: see docs/runbook.md"; exit 1; }

      # Also restarts caddy when the Caddyfile changed (see deploy.sh). The
      # deploy runs detached on the server and this follows its log (#205):
      # losing the connection fails this step, but not the deploy.
      - name: Build & restart services
        run: |
          ssh -i ~/.ssh/deploy_key root@80.69.172.220 "sh /opt/vaalikone/scripts/deploy-detached.sh"

      # Each try and the step itself are time-limited: later deploys queue
      # behind this job, so a connection that never answers must not hold it
      # until GitHub's 6-hour limit (#178).
      - name: Verify deployment
        timeout-minutes: 5
        run: |
          for i in {1..15}; do
            if curl -sSf --connect-timeout 5 --max-time 10 https://avoinvaalikone.fi/api/health; then
              echo "✓ Deployment verified"
              exit 0
            fi
            sleep 4
          done
          echo "✗ Health check failed after deploy"
          exit 1

      # The Cloudflare Cache Rule is manual dashboard state; if it vanishes,
      # origin load multiplies silently. Warn (don't fail the deploy) so the
      # site stays up while someone recreates the rule per docs/scaling.md.
      # The script time-limits each request (#178); `timeout` is a backstop
      # that still ends in the warning, and timeout-minutes one for the step
      # itself, with continue-on-error so hitting it doesn't fail the deploy
      # either (the step shows as failed, the job stays green).
      - name: Verify edge cache
        timeout-minutes: 2
        continue-on-error: true
        run: |
          if ! timeout 90 bash scripts/verify-edge-cache.sh avoinvaalikone.fi; then
            echo "::warning::Cloudflare edge cache check failed — see this step's log and the Cache Rule in docs/scaling.md"
          fi
