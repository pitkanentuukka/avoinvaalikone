name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vaalikone-frontend/package-lock.json

      - name: Install backend deps
        run: npm ci

      - name: Install frontend deps
        run: npm ci
        working-directory: vaalikone-frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: vaalikone-frontend

      - name: Build frontend
        run: npm run build
        working-directory: vaalikone-frontend

      - name: Unit + route tests
        run: npm test

  e2e-api:
    name: E2E API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaalikone
          POSTGRES_PASSWORD: vaalikone_password
          POSTGRES_DB: vaalikone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaalikone"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://vaalikone:vaalikone_password@localhost:5432/vaalikone
      ADMIN_SECRET: test-secret
      NODE_ENV: test
      PORT: 3000
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # restoreRunbook runs the runbook's pg_restore and psql from the runner
      # image, which must match the postgres service's major version (16).
      - name: PostgreSQL regression tests
        run: |
          pg_restore --version && psql --version
          npm test -- --runInBand questionMergeConcurrency orphanQuestionConcurrency candidateRegistrationConcurrency candidateTokenRotation restoreRunbook
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Rate-limit store scripts on a real Redis
        run: npm test -- rateLimitStoreRedis
        env:
          REDIS_TEST_URL: redis://localhost:6379
          REQUIRE_REDIS_TEST: "1"

      - name: Run migrations
        run: npm run migrate

      - name: Start backend
        run: |
          npm start &
          for i in {1..30}; do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 1
          done
          echo "Backend failed to start"
          exit 1

      - name: Run E2E API tests
        run: npm run test:e2e:api

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # The images scripts/deploy.sh builds with `docker compose up --build`, at
  # the contexts docker-compose.yml and docker-compose.prod.yml give them.
  # Built only, never pushed: a Dockerfile that no longer builds (a base image
  # bump, a failing RUN) otherwise fails first on the server, after the merge.
  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build backend image
        run: docker build .

      - name: Build frontend image
        run: docker build vaalikone-frontend

      - name: Build backup image
        run: docker build scripts/backup

  deploy:
    name: Deploy to UpCloud
    needs: [lint-and-unit, e2e-api, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Later deploys queue behind this job, so it must never wait out GitHub's
    # 6-hour limit (#178). A deploy takes about a minute; 30 leaves room for a
    # build with a cold cache. Not always for one that first waits (up to 10
    # minutes) for a lost deploy to finish (#205); hitting the limit then
    # only fails the job, as the deploy carries on detached on the server.
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      # The ssh options (also used by rsync) give up on a server that stops
      # answering, rather than leaving the job to its timeout (#178).
      # The key comes in through the environment, never as `${{ }}` in the
      # script: GitHub pastes that into the text bash parses, so a `$(…)` in
      # the secret, or whatever follows a quote in it, would run (#207). The
      # file is created with mode 600 before the key is written to it
      # (tests/unit/deploySshKey.test.js).
      # The server's host key is pinned in the SSH_KNOWN_HOSTS repository
      # variable, and ssh accepts no other (#206): scanning it here would
      # trust whoever answers at the address, and hand them the tree and a
      # root session. Rotating the server's host key means updating the
      # variable (docs/runbook.md). The step logs the pinned key's
      # fingerprint, to compare with the server's. Only this file counts:
      # the host's block names no other, and $HOME is spelled out because ssh
      # expands `~` from the passwd entry. The config is overwritten, not
      # appended to: ssh takes each option's first value, so an earlier block
      # would win, and it sets every source of host keys, so the runner's
      # /etc/ssh/ssh_config can't add one (tests/unit/deployHostKey.test.js).
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts_deploy
          # A line ssh can parse, without a marker (@revoked, @cert-authority:
          # those print one after the line number).
          if ! ssh-keygen -l -F 80.69.172.220 -f ~/.ssh/known_hosts_deploy > ~/.ssh/pinned \
            || ! grep -qE '^# Host 80\.69\.172\.220 found: line [0-9]+ ?$' ~/.ssh/pinned; then
            echo "::error::The SSH_KNOWN_HOSTS repository variable has no valid host key for 80.69.172.220: see docs/runbook.md"
            exit 1
          fi
          cat ~/.ssh/pinned
          cat > ~/.ssh/config <<SSH_CONFIG
          Host 80.69.172.220
            ConnectTimeout 10
            ServerAliveInterval 15
            ServerAliveCountMax 4
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts_deploy
            GlobalKnownHostsFile none
            KnownHostsCommand none
            UpdateHostKeys no
            VerifyHostKeyDNS no
          SSH_CONFIG

      # Waits for a deploy still running on the server (one this job's
      # predecessor lost contact with, say) by taking deploy.sh's lock on the
      # tree (#205). The server-side rsync is time-limited: one whose client
      # is gone holds the lock until it ends, and only sshd would notice,
      # after about 15 minutes (-k: rsync can block in its SIGTERM handler).
      # The lock wait outlasts that limit. The lock covers this step and the
      # next one separately: a manual rsync can get in between. A wait
      # says so on stderr (not flock --verbose: it writes to stdout, which is
      # rsync's protocol stream), and one that runs out leaves only rsync's
      # "connection unexpectedly closed", hence the hint. mkdir: flock would
      # create a missing tree as a file. docs/scaling.md's manual deploy
      # repeats this command (tests/unit/manualDeployDoc.test.js). The filter
      # is for it: a working checkout, unlike CI's, has files git ignores.
      # `s`: sender side only, so --delete still removes such files from the
      # server, except those excluded by name, such as its .env.
      - name: Rsync to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --rsync-path="mkdir -p /opt/vaalikone && { flock -n /opt/vaalikone true || echo 'Waiting for another deploy to finish' >&2; } && flock -w 600 /opt/vaalikone timeout -k 10 300 rsync" \
            --filter=':-s .gitignore' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='test-results' \
            --exclude='.claude' \
            ./ root@80.69.172.220:/opt/vaalikone/ ||
            { echo "::error::rsync failed. If it was waiting for another deploy, that one still holds the lock; if ssh says \"Host key verification failed\", the server's key isn't the one in SSH_KNOWN_HOSTS: see docs/runbook.md"; exit 1; }

      # Also restarts caddy when the Caddyfile changed (see deploy.sh). The
      # deploy runs detached on the server and this follows its log (#205):
      # losing the connection fails this step, but not the deploy.
      - name: Build & restart services
        run: |
          ssh -i ~/.ssh/deploy_key root@80.69.172.220 "sh /opt/vaalikone/scripts/deploy-detached.sh"

      # Each try and the step itself are time-limited: later deploys queue
      # behind this job, so a connection that never answers must not hold it
      # until GitHub's 6-hour limit (#178).
      - name: Verify deployment
        timeout-minutes: 5
        run: |
          for i in {1..15}; do
            if curl -sSf --connect-timeout 5 --max-time 10 https://avoinvaalikone.fi/api/health; then
              echo "✓ Deployment verified"
              exit 0
            fi
            sleep 4
          done
          echo "✗ Health check failed after deploy"
          exit 1

      # The Cloudflare Cache Rule is manual dashboard state; if it vanishes,
      # origin load multiplies silently. Warn (don't fail the deploy) so the
      # site stays up while someone recreates the rule per docs/scaling.md.
      # The script time-limits each request (#178); `timeout` is a backstop
      # that still ends in the warning, and timeout-minutes one for the step
      # itself, with continue-on-error so hitting it doesn't fail the deploy
      # either (the step shows as failed, the job stays green).
      - name: Verify edge cache
        timeout-minutes: 2
        continue-on-error: true
        run: |
          if ! timeout 90 bash scripts/verify-edge-cache.sh avoinvaalikone.fi; then
            echo "::warning::Cloudflare edge cache check failed — see this step's log and the Cache Rule in docs/scaling.md"
          fi
